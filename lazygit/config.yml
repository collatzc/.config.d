# lazygit 配置 —— 深色,配 Tokyo Night
gui:
  # 左侧栏宽度占比(0~1,默认 0.3333),收窄给右侧 diff 更多空间。
  # 临时放大:焦点切到右侧 diff 后按 + (半屏→全屏,全屏时左侧栏完全隐藏),_ 反向
  sidePanelWidth: 0.25
  theme:
    activeBorderColor:
      - "#7aa2f7"
      - bold
    searchingActiveBorderColor:
      - "#e0af68"
      - bold
    inactiveBorderColor:
      - "#565f89"
    optionsTextColor:
      - "#7aa2f7"
    defaultFgColor:
      - "#c0caf5"
    selectedLineBgColor:
      - "#2f3549"
    inactiveViewSelectedLineBgColor:
      - "#343a55"

git:
  # 差异渲染器,面板里按 | 键循环切换:delta → 逐词 diff → git 原生
  diffRenderers:
    - name: delta
      command: delta --dark --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
      colorArg: always
    - name: color-words
      type: rawGit
      args: [--color-words]
    - name: default
      type: rawGit
