# vim:fileencoding=utf-8:ft=conf:foldmethod=marker

# Fonts {{{

  font_family family="Maple Mono NF CN"
  bold_font auto
  italic_font auto
  bold_italic_font auto
  font_features MapleMono-NF-CN-Regular +zero
  font_features MapleMono-NF-CN-Bold +zero
  font_features MapleMono-NF-CN-Italic +zero
  font_features MapleMono-NF-CN-BoldItalic +zero
  symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b1,U+e700-U+e7c5,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f372,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono
  font_size 15.0

# 精确合成字形（默认 platform = 1.7 30 会改动 AA 像素的 alpha，
# 导致 powerline 小三角的颜色和相邻色块出现色差；1.0 0 为数学上精确的合成）
  text_composition_strategy 1.0 0

# }}}

# General {{{

  term xterm-256color

  hide_window_decorations titlebar-only
  remember_window_size yes
  initial_window_width 1800
  initial_window_height 750

# macOS 统一标题栏：自动主题开启时该选项必须写在 *.auto.conf 里才生效
  macos_show_window_title_in window
  macos_option_as_alt yes
  macos_quit_when_last_window_closed yes

# Other
  shell .
  editor nvim
  allow_remote_control yes
  listen_on unix:/tmp/kitty
  allow_hyperlinks yes
  shell_integration enabled
  confirm_os_window_close 1
  close_on_child_death yes

# 光标（暗色基准值；亮色由 *.auto.conf 覆盖。kitty 0.42+ 的 cursor_trail 动效）
  cursor #47FF9C
  cursor_shape block
  cursor_beam_thickness 8.0
  cursor_underline_thickness 2.0
  cursor_blink_interval 0.5 ease-in-out
  cursor_trail 3
  cursor_trail_decay 0.1 0.3
  cursor_trail_start_threshold 1

# Background（半透明 + 大半径模糊 = macOS 毛玻璃质感）
  background_opacity 0.78
  background_blur 64
# transparent_background_colors blue@0.4 black@0.4
  dynamic_background_opacity yes
  dim_opacity 0.4

# 回滚缓冲加大，配合 kitty-scrollback.nvim
  scrollback_lines 100000

# }}}

# Window layout {{{

  enabled_layouts *
  window_resize_step_cells 2
  window_resize_step_lines 2
  window_border_width 0pt
# 原来的负值 margin 会被 kitty 钳制成 0（无效配置）；呼吸感交给 padding
  window_padding_width 8

# }}}

# Tab bar {{{

  tab_bar_edge top
  tab_bar_margin_width 0.0
  tab_bar_margin_height 0.0 0.0

  tab_bar_style powerline
# round = 圆角分隔的胶囊标签，比 angled 更接近 macOS 原生分段控件
  tab_powerline_style round
  tab_bar_align left
  tab_bar_min_tabs 1
  tab_switch_strategy previous

  tab_activity_symbol none
  tab_title_max_length 64

# {custom} 调用 tab_bar.py 的 draw_title()：按前台命令自动配 Nerd Font 图标，
# SSH 标题、分屏窗口数等逻辑都在 tab_bar.py 里，改图标不用动这里
  tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{secure_input_symbol}{fmt.fg.tab}{custom}"

# none = active tab 继承 tab_title_template
  active_tab_title_template none

# 原生 macOS 标签不做加粗/斜体强调
  active_tab_font_style normal
  inactive_tab_font_style normal

# 标签栏颜色统一由 themes/*.conf 提供（tokyonight_moon / tokyonight_day 随系统明暗切换），
# 此处不再写死颜色，避免与主题冲突

# }}}

# Keybindings {{{

  kitty_mod ctrl+shift

# Scrolling
  map opt+cmd+page_up scroll_line_up
  map cmd+up scroll_line_up

  map opt+cmd+page_down scroll_line_down
  map cmd+down scroll_line_down

  map kitty_mod+k scroll_page_up
  map cmd+page_up scroll_page_up

  map kitty_mod+j scroll_page_down
  map cmd+page_down scroll_page_down

  map kitty_mod+home scroll_home
  map cmd+home scroll_home

  map kitty_mod+end scroll_end
  map cmd+end scroll_end

  map kitty_mod+z scroll_to_prompt -1

# Window management
  map kitty_mod+enter new_window
  map cmd+enter new_window

  map ctrl+alt+enter launch --cwd=current

  map kitty_mod+down neighboring_window bottom
  map kitty_mod+up neighboring_window top
  map kitty_mod+left neighboring_window left
  map kitty_mod+right neighboring_window right

  map kitty_mod+f move_window_forward
  map kitty_mod+b move_window_backward

# Tab management
  map kitty_mod+right next_tab
  map shift+cmd+] next_tab
  map ctrl+tab goto_tab -1

  map kitty_mod+left previous_tab
  map shift+cmd+[ previous_tab
  map ctrl+shift+tab select_tab

  map kitty_mod+t detach_window ask
  map cmd+t launch --cwd=current --type=tab

  map kitty_mod+q close_tab
  map cmd+w close_tab
  map kitty_mod+o close_other_window_in_tab

  map kitty_mod+. move_tab_forward
  map kitty_mod+, move_tab_backward

  map kitty_mod+n set_tab_title

  map cmd+1 goto_tab 1
  map cmd+2 goto_tab 2
  map cmd+3 goto_tab 3
  map cmd+4 goto_tab 4
  map cmd+5 goto_tab 5
  map cmd+6 goto_tab 6
  map cmd+7 goto_tab 7
  map cmd+8 goto_tab 8
  map cmd+9 goto_tab 9

# Layout management
  map kitty_mod+l next_layout

# Font sizes
  map kitty_mod+equal change_font_size all +1.0
  map kitty_mod+plus change_font_size all +1.0
  map kitty_mod+kp_add change_font_size all +1.0
  map cmd+plus change_font_size all +1.0
  map cmd+equal change_font_size all +1.0
  map shift+cmd+equal change_font_size all +1.0

  map kitty_mod+minus change_font_size all -1.0
  map kitty_mod+kp_subtract change_font_size all -1.0
  map cmd+minus change_font_size all -1.0
  map shift+cmd+minus change_font_size all -1.0

  map kitty_mod+backspace change_font_size all 0
  map cmd+0 change_font_size all 0

# Others
  map kitty_mod+u launch --type=background --cwd=current sh -c 'nvim $(pwd)'

  map kitty_mod+comma load_config_file
  action_alias kitty_scrollback_nvim kitten ~/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
# action_alias kitty_scrollback_nvim kitten ~/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py --nvim-args --clean
  map kitty_mod+x kitty_scrollback_nvim
  map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output

# }}}
